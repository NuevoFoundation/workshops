<meta
  name="description"
  content="
{{ with.Description }}
    {{ . }}
{{ else }}
    {{ with.Site.Params.description }}
        {{ . }}
    {{ end }}
{{ end }}"
/>
{{ with.Site.Params.author }}
<meta
  name="author"
  content="
    {{ . }}"
/>
{{ end }}
{{ if .IsHome }}
<link href="{{ "css/workshop-explorer.css" | relURL }}" rel="stylesheet">
{{ end }}

<!-- Nuevo Foundation color palette (CSS variables, --nuevo-coral, etc.) -->
<link href="{{ "css/nuevo-palette.css" | relURL }}" rel="stylesheet">

<!-- Code blocks: Hugo's JSX highlighter marks plain text it doesn't recognize
     (emoji, "¡", accented letters inside JSX) as an error, and the monokailight
     style paints errors as dark boxes that hide the character. Show them as
     normal text instead. -->
<style>
  .highlight span[style*="background-color:#1e0010"] {
    background-color: transparent !important;
    color: inherit !important;
  }
</style>
