name: Diagnostic - DNS/network check (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dns-check:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve models.inference.ai.azure.com (getent/nslookup)
        run: |
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf || true
          echo "=== getent hosts ==="
          getent hosts models.inference.ai.azure.com || echo "getent FAILED"
          echo "=== nslookup ==="
          nslookup models.inference.ai.azure.com || echo "nslookup FAILED"
          echo "=== dig ==="
          dig models.inference.ai.azure.com || echo "dig FAILED (may not be installed)"

      - name: curl HTTPS request to endpoint
        run: |
          echo "=== curl -v (headers only) ==="
          curl -v --max-time 10 -I https://models.inference.ai.azure.com/ || echo "curl FAILED with exit code $?"

      - name: Also test github.com and api.github.com for comparison
        run: |
          echo "=== github.com ==="
          curl -v --max-time 10 -I https://github.com/ || echo "github.com curl FAILED"
          echo "=== api.github.com ==="
          curl -v --max-time 10 -I https://api.github.com/ || echo "api.github.com curl FAILED"
