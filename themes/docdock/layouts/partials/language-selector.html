{{if not .IsHome}}
	{{- if and hugo.IsMultilingual (not .Site.Params.DisableLanguageSwitchingButton)}}
	<select id="select-language-workshop" class="language-selector" aria-label="{{ i18n "tax.dim.language" }}">
		{{ $pageLang := .Page.Lang}}
		{{ range .Page.AllTranslations }}
	  	{{ if eq $pageLang .Lang}}
	    	<option id="{{ .Language }}" value="{{ .Permalink }}" selected>{{ .Site.Language.Label }}</option>
	  	{{ else }}
	    	<option id="{{ .Language }}" value="{{ .Permalink }}">{{ .Site.Language.Label }}</option>
	  	{{ end }}
		{{ end }}
	</select>
	{{- end }}
{{end}}

{{if .IsHome}}
	{{- if and hugo.IsMultilingual (not .Site.Params.DisableLanguageSwitchingButton)}}
	<select id="select-language-home" class="language-selector" aria-label="{{ i18n "tax.dim.language" }}">
		{{ $pageLang := .Page.Lang}}
		{{ range .Page.AllTranslations }}
			{{ if eq $pageLang .Lang}}
				<option id="{{ .Language }}" value="{{ .Permalink }}" selected>{{ .Site.Language.Label }}</option>
			{{ else }}
				<option id="{{ .Language }}" value="{{ .Permalink }}">{{ .Site.Language.Label }}</option>
			{{ end }}
		{{ end }}
	</select>
	{{- end }}
{{end}}
