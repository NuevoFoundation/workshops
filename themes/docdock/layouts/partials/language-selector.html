{{if not .IsHome}}
	{{- if and hugo.IsMultilingual (not .Site.Params.DisableLanguageSwitchingButton)}}
	<select id="select-language-workshop" class="language-selector" aria-label="{{ i18n "tax.dim.language" }}">
		{{ $siteLanguages := .Site.Languages}}
		{{ $pageLang := .Page.Lang}}
		{{ range .Page.AllTranslations }}
	  	{{ $translation := .}}
	  	{{ range $siteLanguages }}
	    	{{ if eq $translation.Lang .Lang }}
	      	{{ if eq $pageLang .Lang}}
	        	<option id="{{ $translation.Language }}" value="{{ $translation.Permalink }}" selected>{{ .LanguageName }}</option>
	      	{{ else }}
	        	<option id="{{ $translation.Language }}" value="{{ $translation.Permalink }}">{{ .LanguageName }}</option>
	      	{{ end }}
	    	{{ end }}
	  	{{ end }}
		{{ end }}
	</select>
	{{- end }}
{{end}}

{{if .IsHome}}
	{{- if and hugo.IsMultilingual (not .Site.Params.DisableLanguageSwitchingButton)}}
	<select id="select-language-home" class="language-selector" aria-label="{{ i18n "tax.dim.language" }}">
		{{ $siteLanguages := .Site.Languages}}
		{{ $pageLang := .Page.Lang}}
		{{ range .Page.AllTranslations }}
		{{ $translation := .}}
		{{ range $siteLanguages }}
			{{ if eq $translation.Lang .Lang }}
			{{ if eq $pageLang .Lang}}
				<option id="{{ $translation.Language }}" value="{{ $translation.Permalink }}" selected>{{ .LanguageName }}</option>
			{{ else }}
				<option id="{{ $translation.Language }}" value="{{ $translation.Permalink }}">{{ .LanguageName }}</option>
			{{ end }}
			{{ end }}
		{{ end }}
		{{ end }}
	</select>
	{{- end }}
{{end}}
