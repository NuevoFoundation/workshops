<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-labelledby="title description">
  <title id="title">Stitches and travel between two motifs</title>
  <desc id="description">Two outlined squares have sides of 20 millimeters and a gap of 10 millimeters. A dashed arrow marks travel without sewing.</desc>
  <rect width="620" height="280" fill="#ffffff"/>
  <g fill="none" stroke="#252525" stroke-width="3">
    <rect x="80" y="60" width="160" height="160"/>
    <rect x="320" y="60" width="160" height="160"/>
    <path d="M240 38H320M240 30V46M320 30V46"/>
    <path d="M55 60V220M47 60H63M47 220H63"/>
  </g>
  <g fill="#252525" font-family="sans-serif" font-size="18">
    <text x="280" y="23" text-anchor="middle">10 mm gap</text>
    <text x="160" y="248" text-anchor="middle">First motif</text>
    <text x="400" y="248" text-anchor="middle">Second motif</text>
    <text x="24" y="140" text-anchor="middle" transform="rotate(-90 24 140)">20 mm side</text>
  </g>
  <path d="M88 228Q200 276 312 228" fill="none" stroke="#6943a0" stroke-width="3" stroke-dasharray="8 5"/>
  <path d="M299 227L313 227L307 240" fill="none" stroke="#6943a0" stroke-width="3"/>
  <text x="540" y="110" text-anchor="middle" fill="#6943a0" font-family="sans-serif" font-size="17">Dashed:</text>
  <text x="540" y="135" text-anchor="middle" fill="#6943a0" font-family="sans-serif" font-size="17">travel,</text>
  <text x="540" y="160" text-anchor="middle" fill="#6943a0" font-family="sans-serif" font-size="17">not sewn</text>
</svg>
